name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  windows-desktop:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test desktop
        run: cargo test -p kaobuddy
      - name: Clippy desktop
        run: cargo clippy -p kaobuddy -- -D warnings
      - name: Build desktop executable
        run: cargo build -p kaobuddy --release --features bundle

  rust-api-compatibility:
    name: Rust API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kaobuddy --no-default-features --features server
      - run: cargo clippy -p kaobuddy --no-default-features --features server -- -D warnings

  legacy-compatibility:
    name: Legacy compatibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e ".[test]"
      - run: npm ci
      - run: pytest -q
      - run: npx tsc --noEmit
      - run: node --import tsx --test tests/frontend/*.test.ts
