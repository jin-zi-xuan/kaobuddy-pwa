name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust and Dioxus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test server
        run: cargo test -p kaobuddy --features server
      - name: Clippy server
        run: cargo clippy -p kaobuddy --features server -- -D warnings
      - name: Check web target
        run: cargo check -p kaobuddy --target wasm32-unknown-unknown --features web

  legacy-compatibility:
    name: Legacy compatibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e ".[test]"
      - run: npm ci
      - run: pytest -q
      - run: npx tsc --noEmit
      - run: node --import tsx --test tests/frontend/*.test.ts
